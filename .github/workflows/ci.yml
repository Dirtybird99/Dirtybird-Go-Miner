name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Benchmark matrix smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:RUNNER_TEMP "bench-matrix"
          ./scripts/bench-matrix.ps1 -Secs 1 -Repeat 3 -Threads 1 -IncludeOvercommit -OutDir $out -Candidate ci-smoke
          $run = Get-ChildItem -LiteralPath $out -Directory |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          $rows = @(Import-Csv -LiteralPath (Join-Path $run.FullName "results.csv"))
          $aggregate = @(Import-Csv -LiteralPath (Join-Path $run.FullName "aggregate.csv"))
          if (-not ($rows.variant -contains "v114-overcommit-pin-high")) {
            throw "overcommit rows were not generated"
          }
          foreach ($row in $rows) {
            $expectedKhs = [double]$row.hashes / [double]$row.seconds / 1000.0
            $expectedPerThread = [double]$row.hashes / [double]$row.seconds / [double]$row.threads
            if ([math]::Abs([double]$row.khs - $expectedKhs) -gt 1e-9) {
              throw "inexact KH/s for $($row.variant) at $($row.threads) threads"
            }
            if ([math]::Abs([double]$row.perThreadHs - $expectedPerThread) -gt 1e-6) {
              throw "inexact per-thread H/s for $($row.variant) at $($row.threads) threads"
            }
          }
          foreach ($group in @($rows | Group-Object variant, threads)) {
            $sample = $group.Group[0]
            $sorted = @($group.Group | ForEach-Object { [double]$_.khs } | Sort-Object)
            $expected = $sorted[[int][math]::Floor($sorted.Count / 2.0)]
            $actual = @($aggregate | Where-Object {
              $_.variant -eq $sample.variant -and [int]$_.threads -eq [int]$sample.threads
            })
            if ($actual.Count -ne 1 -or [math]::Abs([double]$actual[0].medianKhs - $expected) -gt 1e-9) {
              throw "wrong median for $($sample.variant) at $($sample.threads) threads"
            }
          }
      - name: LUT differential
        if: matrix.os == 'ubuntu-latest'
        run: go test -tags lut ./internal/astrobwt -run '^TestLUTDifferentialVsReference$' -count=1
      - name: Race
        run: go test -race -count=1 -timeout=30m ./internal/...
      - name: Shell hygiene
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          while IFS= read -r script; do
            bash -n "$script"
          done < <(git ls-files '*.sh')
          git ls-files -z '*.sh' | xargs -0 shellcheck --severity=error
      - name: Build + selftest
        shell: bash
        run: |
          go build -pgo=default.pgo -trimpath -o go-miner-ci .
          ./go-miner-ci --selftest
      - name: Cross-build linux/arm64
        if: matrix.os == 'ubuntu-latest'
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -pgo=default.pgo -trimpath -o go-miner-arm64 .
      # qemu-user executes the arm64 SHA2/NEON paths, so the release
      # architecture is correctness-gated on every PR, not on release day.
      - name: arm64 selftest + hash gates (qemu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static
          qemu-aarch64-static ./go-miner-arm64 --selftest
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go test -c -o astrobwt-arm64.test ./internal/astrobwt
          qemu-aarch64-static ./astrobwt-arm64.test -test.run '^(TestHashPairMatchesHash|TestPairDifferentialVsSingle)$' -test.v > arm64-tests.log 2>&1 || { cat arm64-tests.log; exit 1; }
          cat arm64-tests.log
          # A filter that matches nothing exits 0 — require real passes, and
          # require the hardware batch path (not the fallback) under qemu.
          grep -q -- "--- PASS" arm64-tests.log
          grep -q "pairHashAvailable=true" arm64-tests.log
      - name: Package smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash scripts/release.sh v0.0.0
          asset=dist/dirtybird-go-miner-v0.0.0.hiveos_mmpos.amd64.tar.gz
          base=$(basename "$asset" .tar.gz)
          version=${base##*-}
          miner=${base%-$version}
          test "$miner" = dirtybird-go-miner
          test "$(tar -xOf "$asset" "$miner/h-manifest.conf" | grep '^CUSTOM_NAME=')" = "CUSTOM_NAME=$miner"
          for script in h-config.sh h-run.sh h-stats.sh; do
            mode=$(tar -tvf "$asset" "$miner/$script" | awk '{print $1}')
            case "$mode" in
              -rwx*) ;;
              *) echo "$script is not executable in $asset" >&2; exit 1 ;;
            esac
          done
