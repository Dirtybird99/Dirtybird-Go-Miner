name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: Linux deps (shellcheck + qemu + arm64 glibc, retried)
        if: matrix.os == 'ubuntu-latest'
        run: |
          for i in 1 2 3; do sudo apt-get update -qq && break || sleep 10; done
          sudo apt-get install -y -qq shellcheck qemu-user-static libc6-arm64-cross
      - name: Vet
        run: |
          # Twice on purpose: a vet leg that does not set the build's own
          # GOAMD64 cannot see that build's assembly, and release ships v3.
          go vet ./...
          GOAMD64=v3 go vet ./...
      - name: Test (GOAMD64=v1)
        env:
          GOAMD64: v1
        run: go test ./...
      - name: Test (GOAMD64=v3)
        env:
          GOAMD64: v3
        run: go test ./...
      - name: Benchmark matrix smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:RUNNER_TEMP "bench-matrix"
          ./scripts/bench-matrix.ps1 -Secs 1 -Repeat 3 -Threads 1 -IncludeOvercommit -OutDir $out -Candidate ci-smoke
          $run = Get-ChildItem -LiteralPath $out -Directory |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          $rows = @(Import-Csv -LiteralPath (Join-Path $run.FullName "results.csv"))
          $aggregate = @(Import-Csv -LiteralPath (Join-Path $run.FullName "aggregate.csv"))
          if (-not ($rows.variant -contains "v114-overcommit-pin-high")) {
            throw "overcommit rows were not generated"
          }
          foreach ($row in $rows) {
            $expectedKhs = [double]$row.hashes / [double]$row.seconds / 1000.0
            $expectedPerThread = [double]$row.hashes / [double]$row.seconds / [double]$row.threads
            if ([math]::Abs([double]$row.khs - $expectedKhs) -gt 1e-9) {
              throw "inexact KH/s for $($row.variant) at $($row.threads) threads"
            }
            if ([math]::Abs([double]$row.perThreadHs - $expectedPerThread) -gt 1e-6) {
              throw "inexact per-thread H/s for $($row.variant) at $($row.threads) threads"
            }
          }
          foreach ($group in @($rows | Group-Object variant, threads)) {
            $sample = $group.Group[0]
            $sorted = @($group.Group | ForEach-Object { [double]$_.khs } | Sort-Object)
            $expected = $sorted[[int][math]::Floor($sorted.Count / 2.0)]
            $actual = @($aggregate | Where-Object {
              $_.variant -eq $sample.variant -and [int]$_.threads -eq [int]$sample.threads
            })
            if ($actual.Count -ne 1 -or [math]::Abs([double]$actual[0].medianKhs - $expected) -gt 1e-9) {
              throw "wrong median for $($sample.variant) at $($sample.threads) threads"
            }
          }
      - name: LUT differential
        if: matrix.os == 'ubuntu-latest'
        run: go test -tags lut ./internal/astrobwt -run '^TestLUTDifferentialVsReference$' -count=1
      # No CI machine is big-endian, so endian_big.go files are otherwise
      # never even compiled — a missing import shipped unnoticed once.
      - name: Big-endian compile gate (s390x)
        if: matrix.os == 'ubuntu-latest'
        run: GOOS=linux GOARCH=s390x go build ./internal/... ./pkg/... .
      - name: Stage-stats accounting
        if: matrix.os == 'ubuntu-latest'
        run: go test -tags stagestats ./internal/astrobwt -run '^TestStageStats' -count=1
      # The analyzer produces the number that decides candidate retention;
      # its OLS is gated the same way bench-matrix's arithmetic is.
      - name: Bench analyzer selftest
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/analyze-thue-morse.py --selftest
      - name: Race
        run: go test -race -count=1 -timeout=30m ./...
      - name: Shell hygiene
        if: runner.os == 'Linux'
        shell: bash
        run: |
          while IFS= read -r script; do
            bash -n "$script"
          done < <(git ls-files '*.sh')
          git ls-files -z '*.sh' | xargs -0 shellcheck --severity=error
      # Also gated at release time, but by then the PR that broke it has merged.
      # A stats regression is invisible except as an N/A hashrate on a rig.
      - name: HiveOS stats parser
        if: runner.os == 'Linux'
        shell: bash
        run: bash config/test-h-stats.sh
      - name: Build + selftest
        env:
          GOAMD64: v3
        shell: bash
        run: |
          go build -pgo=default.pgo -trimpath -o go-miner-ci .
          ./go-miner-ci --selftest
      - name: Cross-build linux/arm64
        if: matrix.os == 'ubuntu-latest'
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -pgo=default.pgo -trimpath -o go-miner-arm64 .
      # qemu-user executes the arm64 SHA2/NEON paths, so the release
      # architecture is correctness-gated on every PR, not on release day.
      - name: arm64 selftest + hash gates (qemu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          qemu-aarch64-static ./go-miner-arm64 --selftest
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go test -c -o astrobwt-arm64.test ./internal/astrobwt
          qemu-aarch64-static ./astrobwt-arm64.test -test.run '^(TestHashPairMatchesHash|TestPairDifferentialVsSingle)$' -test.v > arm64-tests.log 2>&1 || { cat arm64-tests.log; exit 1; }
          cat arm64-tests.log
          # A filter that matches nothing exits 0 — assert each gate by name
          # (a renamed test must fail here, not shrink the filter), and
          # require the hardware batch path (not the fallback) under qemu.
          grep -q -- '--- PASS: TestHashPairMatchesHash' arm64-tests.log
          grep -q -- '--- PASS: TestPairDifferentialVsSingle' arm64-tests.log
          grep -q "pairHashAvailable=true" arm64-tests.log
      - name: Termux asset ELF contract + PIE execution proof
        if: matrix.os == 'ubuntu-latest'
        run: |
          # The Termux asset is a linux-runtime PIE dressed for Android
          # (GOOS=android without cgo hangs at startup: golang.org/issue/31343).
          # Android's linker64 demands: ET_DYN, its own interpreter path,
          # no DT_NEEDED, only RELATIVE relocations (symbol lookups start
          # slowly: golang.org/issue/36028), and PT_TLS alignment >= 64.
          # qemu cannot enforce any of that, so the readelf contract IS
          # the gate.
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -pgo=default.pgo -buildmode=pie -trimpath \
            -ldflags "-I /system/bin/linker64" -o go-miner-termux .
          python3 scripts/patch-tls-align.py go-miner-termux
          readelf -h go-miner-termux | grep -q 'DYN'
          readelf -l go-miner-termux | grep -q '/system/bin/linker64'
          if readelf -d go-miner-termux | grep -qi needed; then
            echo "unexpected DT_NEEDED in Termux binary" >&2
            exit 1
          fi
          if readelf -rW go-miner-termux | awk '/^[0-9a-f]/ && $3 != "R_AARCH64_RELATIVE"' | grep -q .; then
            echo "non-RELATIVE dynamic relocations (slow under linker64)" >&2
            exit 1
          fi
          tlsalign=$(readelf -lW go-miner-termux | awk '$1 == "TLS" {print $NF}')
          if [ -n "$tlsalign" ] && [ "$((tlsalign))" -lt 64 ]; then
            echo "PT_TLS underaligned for bionic: $tlsalign" >&2
            exit 1
          fi
          # Execution proof of the same PIE link mode: a glibc-interp twin
          # runs the full selftest under qemu with an arm64 loader.
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -pgo=default.pgo -buildmode=pie -trimpath -o go-miner-pie-twin .
          qemu-aarch64-static -L /usr/aarch64-linux-gnu ./go-miner-pie-twin --selftest
      - name: Package smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash scripts/release.sh v0.0.0
          asset=dist/dirtybird-go-miner-v0.0.0.hiveos_mmpos.amd64.tar.gz
          base=$(basename "$asset" .tar.gz)
          version=${base##*-}
          miner=${base%-$version}
          test "$miner" = dirtybird-go-miner
          test "$(tar -xOf "$asset" "$miner/h-manifest.conf" | grep '^CUSTOM_NAME=')" = "CUSTOM_NAME=$miner"
          for script in h-config.sh h-run.sh h-stats.sh; do
            mode=$(tar -tvf "$asset" "$miner/$script" | awk '{print $1}')
            case "$mode" in
              -rwx*) ;;
              *) echo "$script is not executable in $asset" >&2; exit 1 ;;
            esac
          done
          for plat in arm64 android-arm64; do
            arm=dist/Dirtybird-Go-Miner-$plat-v0.0.0.tar.gz
            armdir=Dirtybird-Go-Miner-$plat-v0.0.0
            mode=$(tar -tvf "$arm" "$armdir/termux-setup.sh" | awk '{print $1}')
            case "$mode" in
              -rwx*) ;;
              *) echo "termux-setup.sh is not executable in $arm" >&2; exit 1 ;;
            esac
          done
