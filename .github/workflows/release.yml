name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.5"

      - name: Verify signed release tag
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "tag must match vX.Y.Z: $tag" >&2
            exit 1
          }
          tag_type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.type')
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')
          [ "$tag_type" = tag ] || {
            echo "$tag is not an annotated tag" >&2
            exit 1
          }
          verified=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.verification.verified')
          commit=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.object.sha')
          [ "$verified" = true ] || {
            echo "$tag does not have a verified signature" >&2
            exit 1
          }
          [ "$commit" = "$(git rev-parse HEAD)" ] || {
            echo "checked-out commit does not match $tag" >&2
            exit 1
          }
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $tag already exists" >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Gate
        shell: bash
        run: |
          set -euo pipefail
          go vet -mod=readonly ./...
          GOAMD64=v1 go test -mod=readonly ./...
          GOAMD64=v3 go test -mod=readonly ./...
          # The differential gate must PROVE it ran: a renamed test exits 0
          # with "no tests to run" and a renamed env var exits 0 via t.Skip,
          # so require the test's own success line in the output. 250008
          # hashes is sized for a 4-vCPU hosted runner (~6 min); the
          # million-hash run remains the local pre-release standard.
          GOAMD64=v3 V114_GATE_HASHES=250008 go test -mod=readonly -count=1 -timeout=30m -v \
            -run '^TestV114MillionHashGate$' ./internal/astrobwt | tee v114gate.log
          grep -q "V114 GATE: .* hashes matched" v114gate.log
          GOAMD64=v3 go test -mod=readonly -race -count=1 -timeout=30m ./internal/...
          bash config/test-h-stats.sh

      - name: Build release assets
        run: bash scripts/release.sh "${{ steps.ver.outputs.version }}"

      - name: Smoke-test linux binary
        run: |
          set -euo pipefail
          tag="${{ steps.ver.outputs.version }}"
          cd dist
          sha256sum -c SHA256SUMS.txt
          mkdir "$RUNNER_TEMP/go-miner-smoke"
          tar -xzf "Dirtybird-Go-Miner-amd64-$tag.tar.gz" -C "$RUNNER_TEMP/go-miner-smoke"
          bin="$RUNNER_TEMP/go-miner-smoke/Dirtybird-Go-Miner-amd64-$tag/go-miner"
          [ "$("$bin" --version)" = "go-miner $tag" ]
          "$bin" --selftest
          manifest=$(tar -xOf "dirtybird-go-miner-$tag.hiveos_mmpos.amd64.tar.gz" \
            dirtybird-go-miner/h-manifest.conf)
          grep -qx "CUSTOM_VERSION=${tag#v}" <<<"$manifest"

      # The arm64 tarball is exactly what the Termux installer downloads;
      # qemu-user runs the published bytes (including the arm64 SHA kernel)
      # before the release becomes immutable — the Rust sibling smokes its
      # arm64 asset the same way.
      - name: Smoke-test arm64 binary (qemu)
        run: |
          set -euo pipefail
          for i in 1 2 3; do sudo apt-get update -qq && break || sleep 10; done
          sudo apt-get install -y -qq qemu-user-static
          tag="${{ steps.ver.outputs.version }}"
          cd dist
          mkdir "$RUNNER_TEMP/go-miner-arm64-smoke"
          tar -xzf "Dirtybird-Go-Miner-arm64-$tag.tar.gz" -C "$RUNNER_TEMP/go-miner-arm64-smoke"
          bin="$RUNNER_TEMP/go-miner-arm64-smoke/Dirtybird-Go-Miner-arm64-$tag/go-miner"
          [ "$(qemu-aarch64-static "$bin" --version)" = "go-miner $tag" ]
          qemu-aarch64-static "$bin" --selftest
          # The android-arm64 asset (what the Termux installer downloads)
          # cannot be executed by qemu-user against bionic, so its gate is
          # the ELF contract Android's linker64 enforces: ET_DYN, linker64
          # interpreter, no DT_NEEDED, RELATIVE-only relocations, and
          # PT_TLS alignment >= 64. Codegen is proven by the qemu selftest
          # above.
          mkdir "$RUNNER_TEMP/go-miner-android-smoke"
          tar -xzf "Dirtybird-Go-Miner-android-arm64-$tag.tar.gz" \
            -C "$RUNNER_TEMP/go-miner-android-smoke"
          abin="$RUNNER_TEMP/go-miner-android-smoke/Dirtybird-Go-Miner-android-arm64-$tag/go-miner"
          readelf -h "$abin" | grep -q 'DYN'
          readelf -l "$abin" | grep -q '/system/bin/linker64'
          if readelf -d "$abin" | grep -qi needed; then
            echo "unexpected DT_NEEDED in android binary" >&2
            exit 1
          fi
          if readelf -rW "$abin" | awk '/^[0-9a-f]/ && $3 != "R_AARCH64_RELATIVE"' | grep -q .; then
            echo "non-RELATIVE dynamic relocations in android binary" >&2
            exit 1
          fi
          tlsalign=$(readelf -lW "$abin" | awk '$1 == "TLS" {print $NF}')
          if [ -n "$tlsalign" ] && [ "$((tlsalign))" -lt 64 ]; then
            echo "PT_TLS underaligned for bionic: $tlsalign" >&2
            exit 1
          fi
          for plat in arm64 android-arm64; do
            mode=$(tar -tvf "Dirtybird-Go-Miner-$plat-$tag.tar.gz" \
              "Dirtybird-Go-Miner-$plat-$tag/termux-setup.sh" | awk '{print $1}')
            case "$mode" in
              -rwx*) ;;
              *) echo "termux-setup.sh is not executable in the $plat asset" >&2; exit 1 ;;
            esac
          done

      - name: Publish immutable-ready release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.ver.outputs.version }}"
          notes_start=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          assets=(dist/*.zip dist/*.tar.gz dist/SHA256SUMS.txt)
          gh release create "$tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Dirtybird Go Miner $tag" --generate-notes \
            --notes-start-tag "$notes_start"
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json isImmutable --jq '.isImmutable')" = true
          for attempt in 1 2 3; do
            ok=true
            gh release verify "$tag" --repo "$GITHUB_REPOSITORY" || ok=false
            for asset in "${assets[@]}"; do
              gh release verify-asset "$tag" "$asset" \
                --repo "$GITHUB_REPOSITORY" || ok=false
            done
            $ok && exit 0
            sleep 5
          done
          exit 1
